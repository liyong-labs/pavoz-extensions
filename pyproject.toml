[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pavoz-extensions"
version = "0.1.0"
description = "Official extension pack for pavoz — quality gate and cross-stage schema validation as plain decorators"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "liyong-labs" }]
keywords = [
    "pavoz", "workflow", "dag", "orchestration", "quality-gate", "schema",
    "validation", "llm", "convergence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 唯一运行时依赖: 核心库. 核心永不反向依赖本包.
dependencies = ["pavoz>=0.3,<0.4"]

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pyflakes"]

[project.urls]
Homepage = "https://github.com/liyong-labs/pavoz-extensions"
Repository = "https://github.com/liyong-labs/pavoz-extensions"
Issues = "https://github.com/liyong-labs/pavoz-extensions/issues"

[tool.hatch.build.targets.wheel]
packages = ["pavoz_extensions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
