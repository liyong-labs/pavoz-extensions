name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install pytest pytest-asyncio pyflakes
          # 核心依赖来自 PyPI (pavoz 0.5.2 起版本线延续 0.5.x).
          pip install "pavoz>=0.5,<0.6"
          pip install -e . --no-deps
      - name: Lint (pyflakes)
        run: |
          python -m pyflakes pavoz_extensions tests tools
      - name: Public API guard
        run: |
          python tools/check_public_api.py
      - name: Doc links + style
        run: |
          python tools/check_doc_links.py
          python tools/check_doc_style.py
      - name: Test
        run: |
          python -m pytest tests/ -q
